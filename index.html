<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Ricky's searchable Windows, PowerShell, Winget and Microsoft 365 command reference. Find, save and copy everyday IT commands.">
  <meta name="theme-color" content="#f6f8fc">
  <title>Command Reference | Ricky's Commands</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="commands.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#commandsContainer">Skip to commands</a>
  <div class="container">
    <header class="header">
      <div class="brand"><span class="brand-icon" aria-hidden="true">&gt;_</span><div><p class="eyebrow">RICKY'S TOOLKIT</p><h1>Command Reference</h1></div></div>
      <p class="catalog-summary" id="catalogSummary"></p>
    </header>
    <section class="search-panel" aria-label="Find commands">
      <label for="searchInput">Find your next command</label>
      <div class="search-box"><span aria-hidden="true" class="search-icon">⌕</span><input type="search" id="searchInput" placeholder="Search your command library…" autocomplete="off"><button id="clearSearch" type="button" hidden>Clear</button><kbd aria-hidden="true">/</kbd></div>
      <div class="toolbar"><nav id="filters" aria-label="Command categories"></nav><label class="mobile-category" for="categorySelect">Category<select id="categorySelect"></select></label></div>
    </section>
    <div class="results-toolbar">
      <p id="resultCount" role="status" aria-live="polite" aria-atomic="true"></p>
      <div class="view-controls"><button type="button" id="favoritesOnly" aria-pressed="false">☆ Favorites</button><div role="group" aria-label="View"><button type="button" id="cardsView" aria-pressed="true">Cards</button><button type="button" id="listView" aria-pressed="false">List</button></div></div>
    </div>
    <main id="commandsContainer" tabindex="-1"></main>
    <div id="noResults" hidden><h2>No matching commands</h2><p>Try another search, category, or save a favorite using the star button.</p><button type="button" id="resetFilters">Reset filters</button></div>
    <noscript><p>This reference needs JavaScript to display and search commands. Please enable JavaScript and reload.</p></noscript>
    <footer>Built for everyday IT work. <span>Press <kbd>/</kbd> to search · <kbd>Esc</kbd> to clear</span></footer>
  </div>
  <div id="copyStatus" role="status" aria-live="polite" aria-atomic="true"></div>
</body>
</html>
